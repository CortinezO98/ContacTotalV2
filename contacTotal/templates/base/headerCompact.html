{% load static %}
<header id="headerNew" class="headerNew">
    <nav class="navbar navbar-expand-lg py-2">
        <div class="container">
            <!-- LOGO PARA MÓVIL -->
            <a class="navbar-brand d-lg-none" href="{% url 'index' %}">
                {% if logo_type %}
                    <img src="{% static 'img/logomedia.png' %}" alt="Logo Contacto Total" width="120">
                {% endif %}
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a href="{% url 'index' %}" class="nav-link text-danger">Inicio</a></li>
                <li class="nav-item"><a href="{% url 'revista' %}" class="nav-link text-danger">Revista</a></li>
                <li class="nav-item"><a href="{% url 'programas' %}" class="nav-link text-danger">Radio</a></li>
                <li class="nav-item"><a href="{% url 'podcast' %}" class="nav-link text-danger">Podcast</a></li>
                <li class="nav-item"><a href="{% url 'quienesSomos' %}" class="nav-link text-danger">Quienes Somos</a></li>
                <li class="nav-item"><a href="{% url 'equipo' %}" class="nav-link text-danger">Equipo de Trabajo</a></li>
                <li class="nav-item"><a href="{% url 'programacion' %}" class="nav-link text-danger">Programación</a></li>
                <li class="nav-item"><a href="{% url 'contacto' %}" class="nav-link text-danger">Contacto</a></li>
            </ul>
        </div>
        </div>
    </nav>

    <!-- LOGO PARA ESCRITORIO -->
    <div class="header d-none d-lg-block">
        <div class="container text-center">
            <div class="logo-container">
                {% if logo_type %}
                    <img src="{% static 'img/'|add:logo_type|add:'_logo.png' %}" alt="Logo {{ logo_type }}" class="logo" width="100">
                {% else %}
                    <img src="{% static 'img/LogoRojo.png' %}" alt="Contacto Total Media" class="logo" width="200">
                {% endif %}
            </div>
        </div>
    </div>
</header>
