{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4TXWMJW92N"></script>

    <script>

      window.dataLayer = window.dataLayer || [];

      function gtag(){dataLayer.push(arguments);}

      gtag('js', new Date());


      gtag('config', 'G-4TXWMJW92N');

    </script>

    <!-- Título dinámico -->
    <title>{% block title %}Contacto Total{% endblock %}</title>

    <!-- Meta tags básicos -->
    <meta name="description" content="{% block description %}Contacto Total Media - Radio, Revista y Podcast{% endblock %}">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <meta property="og:title" content="{% block og_title %}Contacto Total{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Contacto Total Media - Radio, Revista y Podcast{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'img/logomedia.png' %}{% endblock %}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="{{ request.build_absolute_uri }}">
    <meta property="twitter:title" content="{% block twitter_title %}Contacto Total{% endblock %}">
    <meta property="twitter:description" content="{% block twitter_description %}Contacto Total Media - Radio, Revista y Podcast{% endblock %}">
    <meta property="twitter:image" content="{% block twitter_image %}{{ request.scheme }}://{{ request.get_host }}{% static 'img/logomedia.png' %}{% endblock %}">
    
    <link rel="icon" type="image/png" href="{% static 'img/logomedia.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <link rel="stylesheet" href="{% static 'css/styless.css'  %}">
</head>
<body>
    <script>
    (function () {
      try {
        var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
        if (!tz) return;

        var cookieName = "user_tz";
        var current = document.cookie.split("; ").find(function(r){ return r.startsWith(cookieName + "="); });
        var currentVal = current ? decodeURIComponent(current.split("=")[1]) : "";

        if (currentVal !== tz) {
          var maxAge = 60 * 60 * 24 * 180;
          var secure = (location.protocol === "https:") ? "; Secure" : "";
          document.cookie = cookieName + "=" + encodeURIComponent(tz)
            + "; Path=/; Max-Age=" + maxAge + "; SameSite=Lax" + secure;
          if (!sessionStorage.getItem("tz_reload_done")) {
            sessionStorage.setItem("tz_reload_done", "1");
            location.reload();
          }
        }
      } catch (e) { /* no-op */ }
    })();
    </script>

    <div class="d-flex flex-column min-vh-100">
        {% block header %}
            {% include 'base/header.html' %}
        {% endblock %}
        <main class="flex-fill">
            {% block main %}{% endblock %}
        </main>
        {% block footer %}
            {% include 'base/footer.html' %}
        {% endblock %}
    </div>

    <!-- Botón flotante -->
    <a href="{% url 'anunciate' %}" class="floating-logo" title="Anúnciate con nosotros" aria-label="Anúnciate con nosotros">
        <img src="{% static 'img/boton.png' %}" alt="Botón Anúnciate">
    </a>

    <script src="{% static 'js/scripts.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
