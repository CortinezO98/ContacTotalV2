{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto Total</title>
    <link rel="icon" type="image/png" href="{% static 'img/logomedia.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <link rel="stylesheet" href="{% static 'css/styless.css'  %}">
</head>
<body>
    <div class="d-flex flex-column min-vh-100">
        {% block header %}
            {% include 'base/header.html' %}
        {% endblock %}
        <main class="flex-fill">
            {% block main %}{% endblock %}
        </main>
        {% block footer %}
            {% include 'base/footer.html' %}
        {% endblock %}
    </div>

    <!-- Botón flotante -->
    <a href="{% url 'anunciate' %}" class="floating-logo" title="Anúnciate con nosotros" aria-label="Anúnciate con nosotros">
        <img src="{% static 'img/anunciate2.jpg' %}" alt="Botón Anúnciate">
    </a>

    <script src="{% static 'js/scripts.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    {% block extra_scripts %}{% endblock %}
    
</body>
</html>
